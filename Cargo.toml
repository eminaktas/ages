[workspace]
members = [".", "crates/pixelart"]

[package]
name = "ages"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Show how old the people you care about are, live, in your terminal"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fluent-bundle = "0.16"
home = "0.5"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
image = "0.25"
pixelart = { path = "crates/pixelart", version = "0.1.0" }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
unicode-width = "0.2"
unic-langid = { version = "0.9", features = ["macros"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
