name: Release

# Tag a commit as `X.Y.Z` (no `v` prefix) and push it: this builds binaries for
# macOS and Linux and publishes them on a GitHub Release with that tag.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check Cargo.toml version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          crate="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')"
          tag="${GITHUB_REF_NAME}"
          echo "Cargo.toml: $crate  tag: $tag"
          [ "$crate" = "$tag" ] || { echo "::error::Cargo.toml version ($crate) != tag ($tag)"; exit 1; }

  build:
    name: build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # `name` is the asset name users download: ages-<os>-<arch>.tar.gz (no version, so
        # `releases/latest/download/...` URLs stay stable). Linux uses musl for fully static
        # binaries that run on any distro.
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            name: linux-arm64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/ages-${{ matrix.name }}.tar.gz" ages
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          name: ages ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
